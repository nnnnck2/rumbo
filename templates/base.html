{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Rumbo{% endblock %} · Multivisa</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/rumbo.css' %}">
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <nav class="navbar navbar-expand bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'inicio' %}">Rumbo</a>
      <div class="navbar-nav ms-auto">
        {% if user.is_authenticated %}
          <a class="nav-link" href="{% url 'leads:lista' %}">Leads</a>
          {% if rumbo.es_admin %}<a class="nav-link" href="{% url 'leads:configuracion' %}">Configuración</a>{% endif %}
          <span class="navbar-text ms-2 me-3">{{ user.get_username }}</span>
        {% else %}
          <a class="nav-link" href="{% url 'admin:login' %}">Ingresar</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <main class="container py-4">{% block contenido %}{% endblock %}</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</body>
</html>
