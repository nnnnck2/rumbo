# Rumbo · pgBackRest
# (pgBackRest no admite comentarios al final de una línea: van siempre en su propia línea)
#
# La clave de cifrado del repositorio llega por la variable PGBACKREST_REPO1_CIPHER_PASS
# (nunca en este archivo). Sin esa clave los respaldos no se pueden leer: guárdela fuera del VPS.

[global]
repo1-path=/var/lib/pgbackrest
repo1-cipher-type=aes-256-cbc
# 4 respaldos completos semanales ≈ 1 mes de recuperación a cualquier punto en el tiempo
repo1-retention-full=4
repo1-retention-full-type=count
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
process-max=2
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
# Si el repositorio falla, el WAL pendiente no puede llenar el disco del VPS
archive-push-queue-max=2GiB
log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

# ── Copia fuera del servidor (recomendado en producción) ──────────────────
# Un respaldo en el mismo VPS no protege si se pierde el VPS. Descomentar y completar
# con un bucket S3 compatible (AWS S3, Backblaze B2, Cloudflare R2, Wasabi...).
# Credenciales por variables: PGBACKREST_REPO2_S3_KEY / PGBACKREST_REPO2_S3_KEY_SECRET /
# PGBACKREST_REPO2_CIPHER_PASS
#repo2-type=s3
#repo2-s3-bucket=rumbo-respaldos
#repo2-s3-endpoint=s3.us-east-1.amazonaws.com
#repo2-s3-region=us-east-1
#repo2-path=/rumbo
#repo2-cipher-type=aes-256-cbc
#repo2-retention-full=8

[rumbo]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
