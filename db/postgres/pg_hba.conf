# Rumbo · pg_hba.conf
# TYPE    DATABASE      USER                ADDRESS     METHOD
# Superusuario: solo por socket local dentro del contenedor (docker compose exec -u postgres ...)
local     all           postgres                        peer
local     replication   postgres                        peer
# Migraciones al iniciar el contenedor (socket local, con contraseña)
local     rumbo         rumbo_migrator                  scram-sha-256

# Red interna de Docker, siempre con TLS y SCRAM
hostssl   replication   rumbo_replicacion   samenet     scram-sha-256
hostssl   rumbo         rumbo_app           samenet     scram-sha-256
hostssl   rumbo         rumbo_callflow      samenet     scram-sha-256
hostssl   rumbo         rumbo_migrator      samenet     scram-sha-256

# CALLFLOW desde la red de la oficina: descomentar con la IP pública fija de la oficina
# hostssl rumbo         rumbo_callflow      203.0.113.10/32  scram-sha-256

# Todo lo demás se rechaza (incluido cualquier intento sin TLS)
host      all           all                 all         reject
hostnossl all           all                 all         reject
local     all           all                             reject
