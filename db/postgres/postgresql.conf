# Rumbo · PostgreSQL 17
# Dimensionado para un VPS de 2 vCPU / 4 GB (10 asesores, ~15 leads/día). Ajustar con la RAM real.

# ── Conexión ────────────────────────────────────────────────────────────────
listen_addresses = '*'
port = 5432
max_connections = 100
hba_file = '/etc/postgresql/pg_hba.conf'
data_directory = '/var/lib/postgresql/data'

# ── Seguridad ───────────────────────────────────────────────────────────────
password_encryption = scram-sha-256
ssl = on
ssl_cert_file = '/etc/postgresql/ssl/server.crt'
ssl_key_file = '/etc/postgresql/ssl/server.key'
ssl_min_protocol_version = 'TLSv1.2'

# ── Memoria y planificador ──────────────────────────────────────────────────
shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 8MB
maintenance_work_mem = 128MB
random_page_cost = 1.1              # disco SSD
effective_io_concurrency = 200

# ── Durabilidad (no se sacrifica nada por velocidad) ────────────────────────
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = on

# ── WAL, replicación y archivado continuo para PITR ─────────────────────────
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
max_slot_wal_keep_size = 4GB        # una réplica caída no puede llenar el disco
wal_keep_size = 512MB
hot_standby = on
hot_standby_feedback = on
archive_mode = on
archive_command = 'pgbackrest --stanza=rumbo archive-push %p'
archive_timeout = 60                # como máximo 1 minuto de datos sin archivar
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ── Concurrencia y bloqueos ─────────────────────────────────────────────────
default_transaction_isolation = 'read committed'
deadlock_timeout = 1s
lock_timeout = 0                    # se fija por rol (ver 00-roles.sh)
idle_in_transaction_session_timeout = 60s
log_lock_waits = on                 # registra esperas de bloqueo > deadlock_timeout

# ── Autovacuum (tablas pequeñas con muchas actualizaciones) ─────────────────
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.05

# ── Observabilidad ──────────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
track_io_timing = on
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d/%a '
log_connections = on
log_disconnections = on
log_statement = 'ddl'               # todo cambio de estructura queda registrado
log_min_duration_statement = 500ms
log_checkpoints = on
log_autovacuum_min_duration = 1s
log_timezone = 'America/Guayaquil'
timezone = 'UTC'                    # se guarda en UTC; se muestra en la zona del usuario
