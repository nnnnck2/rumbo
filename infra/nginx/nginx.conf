worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    server_tokens off;
    keepalive_timeout 30s;

    client_max_body_size 5m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    log_format principal '$remote_addr - $remote_user [$time_local] "$request" '
                         '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                         'rt=$request_time';
    access_log /var/log/nginx/access.log principal;

    # Límites de peticiones: el webhook de Meta tiene su propio límite, más alto.
    limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=50r/s;
    limit_req_status 429;

    # Resolver interno de Docker: permite arrancar nginx aunque "web" todavía no exista.
    resolver 127.0.0.11 valid=30s ipv6=off;

    include /etc/nginx/conf.d/*.conf;
}
