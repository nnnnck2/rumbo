# Rumbo · pila pública del VPS (SCRUM-15)
#   nginx    → único servicio expuesto a internet (80 y 443). Termina HTTPS y hace de proxy inverso.
#   certbot  → renueva el certificado de Let's Encrypt cada 12 h (solo lo cambia si faltan < 30 días).
#   redis    → broker de Celery (SCRUM-17). Sin puerto publicado.
#   web / worker / beat → Django + Celery. Perfil "app": se activan cuando exista el proyecto (SCRUM-14).
#
# La base de datos es otra pila (db/docker-compose.yml). Esta se une a su red "rumbo_db".
#
# Uso (desde infra/):  cp .env.example .env  →  ../infra/scripts/desplegar.sh

name: rumbo-infra

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO}
      NGINX_ENVSUBST_FILTER: "^DOMINIO$$"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/estatico:/usr/share/nginx/estatico:ro
      - certificados:/etc/letsencrypt:ro
      - acme:/var/www/acme:ro
      - estaticos_django:/srv/static:ro
    # Recarga cada 12 h para tomar el certificado renovado sin reiniciar.
    command: >
      /bin/sh -c 'while :; do sleep 12h; nginx -s reload; done &
                  exec /docker-entrypoint.sh nginx -g "daemon off;"'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/salud >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [web]
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  certbot:
    image: certbot/certbot:v4.1.1
    restart: unless-stopped
    volumes:
      - certificados:/etc/letsencrypt
      - acme:/var/www/acme
    entrypoint: >
      /bin/sh -c 'trap exit TERM; while :; do
                    certbot renew --webroot -w /var/www/acme --quiet;
                    sleep 12h & wait $${!};
                  done'
    logging: *logs

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Falta REDIS_PASSWORD}",
              "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [interna]
    logging: *logs

  # ── Aplicación (se activa con --profile app cuando exista app/ — SCRUM-14) ──────────
  web: &app
    profiles: [app]
    build:
      context: ../app
    image: rumbo-app:latest
    restart: unless-stopped
    env_file: [../app/.env]
    environment:
      DJANGO_ALLOWED_HOSTS: ${DOMINIO}
      DJANGO_CSRF_TRUSTED_ORIGINS: https://${DOMINIO}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      DB_HOST: db
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000",
              "--workers", "3", "--timeout", "30", "--access-logfile", "-"]
    volumes:
      - estaticos_django:/app/staticfiles
    depends_on:
      redis: { condition: service_healthy }
    networks: [web, interna, rumbo_db]
    logging: *logs

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    volumes: []
    networks: [interna, rumbo_db]

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    volumes: []
    networks: [interna, rumbo_db]

volumes:
  certificados:
  acme:
  redis:
  estaticos_django:

networks:
  web:
  interna:
    internal: true
  # Creada por la pila de la base (db/docker-compose.yml)
  rumbo_db:
    external: true
    name: rumbo_db
