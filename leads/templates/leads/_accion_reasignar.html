{# RF-16 · Reasignar el lead a otro asesor (SCRUM-32). Solo supervisor/admin: para el asesor, reasignar_form es None. #}
{% if reasignar_form %}
<div class="bloque-gestion">
  <h3 class="titulo-bloque">Reasignar</h3>
  <form method="post" action="{% url 'leads:reasignar' lead.pk %}"
        hx-post="{% url 'leads:reasignar' lead.pk %}" hx-target="#ficha" hx-swap="innerHTML">
    {% csrf_token %}
    <label class="visually-hidden" for="{{ reasignar_form.asesor.id_for_label }}">{{ reasignar_form.asesor.label }}</label>
    <div class="input-group input-group-sm">
      {{ reasignar_form.asesor }}
      <button class="btn btn-outline-primary" type="submit">Reasignar</button>
    </div>
    {% for e in reasignar_form.asesor.errors %}<div class="invalid-feedback d-block">{{ e }}</div>{% endfor %}
  </form>
</div>
{% endif %}
