{% comment %}Insignia de "Llamadas atrasadas" en el menú (supervisor/admin). HTMX la pide cada 30 s y reemplaza este elemento.
   Los avisos con sonido y del navegador ahora llegan por la campana de notificaciones (017).{% endcomment %}
<span id="alertas-contador" class="contador-menu{% if not total %} d-none{% endif %}"
      hx-get="{% url 'leads:alertas_contador' %}" hx-trigger="every 30s" hx-swap="outerHTML"
      title="Llamadas atrasadas">{{ total }}</span>
